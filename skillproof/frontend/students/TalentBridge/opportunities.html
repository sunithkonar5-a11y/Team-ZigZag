<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discover Opportunities — TalentBridge</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/opportunities.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/opportunities.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>

  <!-- Mobile Topbar -->
  <div class="mobile-topbar">
    <a href="index.html" class="brand-logo light">
      <div class="logo-mark">TB</div>
      Talent<span>Bridge</span>
    </a>
    <button class="menu-toggle-btn" id="mobileMenuToggle" aria-label="Open Navigation">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="app-layout">
    <!-- Left Sidebar -->
    <aside class="sidebar" id="appSidebar">
      <div class="sidebar-header">
        <a href="index.html" class="brand-logo light">
          <div class="logo-mark">TB</div>
          Talent<span>Bridge</span>
        </a>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          Dashboard
        </a>
        <a href="explore.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          Explore Talent
        </a>
        <a href="opportunities.html" class="nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
          Opportunities
        </a>
        <a href="projects.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
          Projects
        </a>
        <a href="profile.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          Profile
        </a>
        <a href="onboarding.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          Settings
        </a>
      </nav>

      <div class="sidebar-footer">
        <a href="profile.html" class="sidebar-user">
          <div class="avatar" id="sidebarUserAvatar">SR</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebarUserName">Siddharth Roy</div>
            <div class="sidebar-user-role" id="sidebarUserRole">IIT Kharagpur</div>
          </div>
        </a>
        <button class="logout-btn" id="logoutBtn" title="Log Out">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-header">
        <div>
          <h1 class="page-title">Discover Opportunities</h1>
          <p class="page-subtitle">Find internships, hackathons, competitions, and projects that match your skills.</p>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="card opp-search-bar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="oppSearchInput" placeholder="Search opportunities..." />
      </div>

      <!-- Two-Column Layout -->
      <div class="opportunities-layout">
        <!-- Left Filter Sidebar -->
        <aside class="card filter-sidebar">
          <div class="filter-sidebar-top">
            <h3>Filters</h3>
            <button type="button" class="reset-filters-btn" id="resetOppFilters">Reset</button>
          </div>

          <!-- Opportunity Type -->
          <div class="filter-group">
            <h4>Opportunity Type</h4>
            <label class="filter-check"><input type="checkbox" name="oppType" value="Internship" /> <span>Internship</span></label>
            <label class="filter-check"><input type="checkbox" name="oppType" value="Hackathon" /> <span>Hackathon</span></label>
            <label class="filter-check"><input type="checkbox" name="oppType" value="Competition" /> <span>Competition</span></label>
            <label class="filter-check"><input type="checkbox" name="oppType" value="Workshop" /> <span>Workshop</span></label>
            <label class="filter-check"><input type="checkbox" name="oppType" value="Project" /> <span>Project</span></label>
          </div>

          <!-- Skills -->
          <div class="filter-group">
            <h4>Skills</h4>
            <div class="filter-skill-chips" id="oppSkillFilters">
              <button type="button" class="filter-skill-btn" data-skill="HTML">HTML</button>
              <button type="button" class="filter-skill-btn" data-skill="CSS">CSS</button>
              <button type="button" class="filter-skill-btn" data-skill="JavaScript">JavaScript</button>
              <button type="button" class="filter-skill-btn" data-skill="Python">Python</button>
              <button type="button" class="filter-skill-btn" data-skill="UI/UX">UI/UX</button>
              <button type="button" class="filter-skill-btn" data-skill="SQL">SQL</button>
              <button type="button" class="filter-skill-btn" data-skill="Machine Learning">Machine Learning</button>
              <button type="button" class="filter-skill-btn" data-skill="C++">C++</button>
            </div>
          </div>

          <!-- Location -->
          <div class="filter-group">
            <h4>Location Mode</h4>
            <label class="filter-check"><input type="checkbox" name="oppLoc" value="Remote" /> <span>Remote</span></label>
            <label class="filter-check"><input type="checkbox" name="oppLoc" value="On-site" /> <span>On-site</span></label>
            <label class="filter-check"><input type="checkbox" name="oppLoc" value="Hybrid" /> <span>Hybrid</span></label>
          </div>
        </aside>

        <!-- Right Opportunity Cards List -->
        <div class="opportunities-list" id="opportunitiesList">
          <!-- Dynamically rendered via opportunities.js -->
        </div>
      </div>
    </main>
  </div>

  <script src="js/main.js"></script>
  <script src="js/opportunities.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/opportunities.js"></script>
</body>
</html>
