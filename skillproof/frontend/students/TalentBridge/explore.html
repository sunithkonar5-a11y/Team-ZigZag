<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/explore.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <!-- Mobile Topbar -->

        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>

    </button>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="app-layout">
    <!-- Left Sidebar -->
    <aside class="sidebar" id="appSidebar">
      <div class="sidebar-header">
        <a href="index.html" class="brand-logo light">
          <div class="logo-mark">TB</div>
          Talent<span>Bridge</span>
        </a>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          Dashboard
        </a>
        <a href="explore.html" class="nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          Explore Talent
        </a>
        <a href="opportunities.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
          Opportunities
        </a>
        <a href="projects.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
          Projects
        </a>
        <a href="profile.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          Profile
        </a>
        <a href="onboarding.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          Settings
        </a>
      </nav>

      <div class="sidebar-footer">
        <a href="profile.html" class="sidebar-user">
          <div class="avatar" id="sidebarUserAvatar">SR</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebarUserName">Siddharth Roy</div>
            <div class="sidebar-user-role" id="sidebarUserRole">IIT Kharagpur</div>
          </div>
        </a>
        <button class="logout-btn" id="logoutBtn" title="Log Out">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-header">
        <div>
          <h1 class="page-title">Explore Talent</h1>
          <p class="page-subtitle">Discover students based on skills, interests, and potential.</p>
        </div>
      </div>

      <!-- Search and Filter Controls -->
      <div class="card search-filter-panel">
        <div class="large-search-wrap">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="talentSearchInput" placeholder="Search students, skills or interests..." />
        </div>

        <div class="filter-bar">
          <select id="filterSkill" class="form-control">
            <option value="">All Skills</option>
            <option value="JavaScript">JavaScript</option>
            <option value="Python">Python</option>
            <option value="UI/UX">UI/UX</option>
            <option value="Machine Learning">Machine Learning</option>
            <option value="C++">C++</option>
            <option value="SQL">SQL</option>
          </select>

          <select id="filterDomain" class="form-control">
            <option value="">All Domains</option>
            <option value="Frontend & UI/UX">Frontend & UI/UX</option>
            <option value="AI & Data Science">AI & Data Science</option>
            <option value="Software Engineering">Software Engineering</option>
            <option value="Full-Stack Web">Full-Stack Web</option>
          </select>

          <select id="filterCollege" class="form-control">
            <option value="">All Colleges</option>
            <option value="IIT Bombay">IIT Bombay</option>
            <option value="BITS Pilani">BITS Pilani</option>
            <option value="NIT Trichy">NIT Trichy</option>
            <option value="IIIT Hyderabad">IIIT Hyderabad</option>
            <option value="Jadavpur University">Jadavpur University</option>
            <option value="VIT Vellore">VIT Vellore</option>
          </select>

          <select id="filterLevel" class="form-control">
            <option value="">All Experience Levels</option>
            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>
          </select>
        </div>
      </div>

      <!-- Student Cards Grid -->
      <div class="talent-grid" id="talentGrid">
        <!-- Rendered dynamically by explore.js -->
      </div>
    </main>
  </div>

  <script src="js/main.js"></script>
  <script src="js/explore.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/explore.js"></script>
</body>
</html>
