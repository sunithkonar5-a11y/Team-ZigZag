version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: skillproof-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_skillproof
      MYSQL_DATABASE: skillproof_db
      MYSQL_USER: skillproof_user
      MYSQL_PASSWORD: skillproof_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "skillproof_user", "-pskillproof_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mysql_data:
    driver: local

